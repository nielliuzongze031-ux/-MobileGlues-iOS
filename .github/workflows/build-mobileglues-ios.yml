name: Build MobileGlues for iOS arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Install tools
        run: |
          brew install cmake ninja

      - name: Download MobileGlues source
        run: |
          git clone --recursive https://github.com/MobileGL-Dev/MobileGlues.git
          cd MobileGlues
          git submodule update --init --recursive

      - name: Build MobileGlues for iOS arm64
        run: |
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"

          cmake \
            -S MobileGlues/MobileGlues-cpp \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDKROOT" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DBUILD_SHARED_LIBS=ON

          cmake --build build --config Release -j 3

      - name: Find dylibs
        run: |
          echo "Searching for compiled dylibs..."
          find build -type f -name "*.dylib" -print

          mkdir -p output

          find build -type f -name "*.dylib" -exec cp {} output/ \;

          echo "Output:"
          ls -lah output

      - name: Upload iOS dylibs
        uses: actions/upload-artifact@v4
        with:
          name: MobileGlues-iOS-arm64
          path: output/
          if-no-files-found: error
