name: Build MobileGlues 1.3.5 for iOS arm64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Install tools
        run: |
          brew install cmake ninja

      - name: Download exact MobileGlues 1.3.5 source
        run: |
          set -euxo pipefail

          git clone https://github.com/MobileGL-Dev/MobileGlues-plugin.git

          cd MobileGlues-plugin

          git checkout e1d0b24

          git submodule update --init --recursive

          echo "Plugin commit:"
          git rev-parse HEAD

          echo "MobileGlues commit:"
          git -C MobileGlues rev-parse HEAD

          test -f MobileGlues/MobileGlues-cpp/CMakeLists.txt

      - name: Build MobileGlues for iOS arm64
        run: |
          set -euxo pipefail

          SDKPATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          cmake \
            -S MobileGlues-plugin/MobileGlues/MobileGlues-cpp \
            -B build-ios \
            -G Ninja \
            -DMACOS=1 \
            -DCMAKE_CROSSCOMPILING=true \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_OSX_SYSROOT="$SDKPATH" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_C_FLAGS="-arch arm64" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

          cmake \
            --build build-ios \
            --target mobileglues \
            -j"$(sysctl -n hw.ncpu)"

      - name: Prepare dylibs
        run: |
          set -euxo pipefail

          mkdir -p artifact

          MG_DYLIB="$(find build-ios -name 'libmobileglues.dylib' -print -quit)"

          test -n "$MG_DYLIB"

          cp "$MG_DYLIB" artifact/libmobileglues.dylib

          SPIRV_DYLIB="$(find MobileGlues-plugin/MobileGlues \
            -name 'libspirv-cross-c-shared.0.dylib' \
            -print -quit || true)"

          if [ -n "$SPIRV_DYLIB" ]; then
            cp "$SPIRV_DYLIB" \
              artifact/libspirv-cross-c-shared.0.dylib
          fi

          echo "Artifacts:"
          ls -lah artifact

          file artifact/*

          lipo -info artifact/libmobileglues.dylib || true

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: MobileGlues-1.3.5-iOS-arm64
          path: artifact/
          if-no-files-found: error
