name: Build Clean Amethyst 2.1.3 + MobileGlues 1.3.5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-14

    env:
      AMETHYST_URL: https://github.com/catsruledogs/Amethyst-iOS-25/releases/download/2.1.3/AngelAuraAmethyst-2.1.3.ipa
      AMETHYST_SHA256: 2c0d01d117b2dc8caa96fef7843429d5c331f4a90be33a9049dada17fe13ab65
      OUTPUT_IPA: AngelAuraAmethyst-2.1.3-MG1.3.5-CLEAN.ipa

    steps:
      - name: Install tools
        run: |
          brew install cmake ninja

      - name: Download exact Amethyst 2.1.3
        run: |
          set -euxo pipefail

          curl -L --fail --retry 3 \
            "$AMETHYST_URL" \
            -o Amethyst-2.1.3.ipa

          echo "$AMETHYST_SHA256  Amethyst-2.1.3.ipa" \
            | shasum -a 256 -c -

      - name: Download exact MobileGlues 1.3.5 source
        run: |
          set -euxo pipefail

          git clone https://github.com/MobileGL-Dev/MobileGlues-plugin.git

          cd MobileGlues-plugin
          git checkout e1d0b24
          git submodule update --init --recursive

      - name: Build MobileGlues 1.3.5 for iOS arm64
        run: |
          set -euxo pipefail

          SDKPATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          cmake \
            -S MobileGlues-plugin/MobileGlues/MobileGlues-cpp \
            -B build-ios \
            -G Ninja \
            -DMACOS=1 \
            -DCMAKE_CROSSCOMPILING=true \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_OSX_SYSROOT="$SDKPATH" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_C_FLAGS="-arch arm64" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

          cmake \
            --build build-ios \
            --target mobileglues \
            -j"$(sysctl -n hw.ncpu)"

      - name: Extract IPA
        run: |
          set -euxo pipefail

          rm -rf ipa-work
          mkdir ipa-work

          ditto -x -k \
            Amethyst-2.1.3.ipa \
            ipa-work

          APP_DIR="$(find ipa-work/Payload \
            -maxdepth 1 \
            -type d \
            -name '*.app' \
            -print -quit)"

          test -n "$APP_DIR"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Replace MobileGlues
        run: |
          set -euxo pipefail

          TARGET="$APP_DIR/Frameworks/libmobileglues.dylib"

          MG_DYLIB="$(find build-ios \
            -name 'libmobileglues.dylib' \
            -print -quit)"

          test -f "$TARGET"
          test -n "$MG_DYLIB"

          cp -f "$MG_DYLIB" "$TARGET"
          chmod 755 "$TARGET"

          echo "New MobileGlues:"
          file "$TARGET"
          ls -lh "$TARGET"
          lipo -info "$TARGET" || true

      - name: Remove old signing data
        run: |
          set -euxo pipefail

          echo "Removing old _CodeSignature folders..."

          find "$APP_DIR" \
            -type d \
            -name "_CodeSignature" \
            -prune \
            -exec rm -rf {} + || true

          echo "Removing old provisioning profiles..."

          find "$APP_DIR" \
            -name "embedded.mobileprovision" \
            -type f \
            -delete || true

          echo "Removing old Mach-O code signatures..."

          while IFS= read -r -d '' FILE; do
            if file "$FILE" | grep -q "Mach-O"; then
              echo "Stripping signature: $FILE"
              codesign --remove-signature "$FILE" 2>/dev/null || true
            fi
          done < <(find "$APP_DIR" -type f -print0)

          echo "Remaining signature directories:"
          find "$APP_DIR" -name "_CodeSignature" -print || true

          echo "Remaining provisioning profiles:"
          find "$APP_DIR" -name "embedded.mobileprovision" -print || true

      - name: Verify MobileGlues still exists
        run: |
          set -euxo pipefail

          TARGET="$APP_DIR/Frameworks/libmobileglues.dylib"

          test -f "$TARGET"

          file "$TARGET"
          lipo -info "$TARGET" || true
          ls -lh "$TARGET"

      - name: Build clean unsigned IPA
        run: |
          set -euxo pipefail

          rm -f "$OUTPUT_IPA"

          cd ipa-work

          /usr/bin/zip \
            -qry \
            -y \
            "../$OUTPUT_IPA" \
            Payload

          cd ..

          unzip -t "$OUTPUT_IPA" >/dev/null

          echo "Final IPA:"
          ls -lh "$OUTPUT_IPA"

          shasum -a 256 "$OUTPUT_IPA"

      - name: Upload clean IPA
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-2.1.3-MG1.3.5-CLEAN
          path: ${{ env.OUTPUT_IPA }}
          compression-level: 0
          if-no-files-found: error
